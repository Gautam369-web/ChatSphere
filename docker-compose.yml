version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chatsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chatsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Presence, Typing & Socket.IO horizontal scaling
  redis:
    image: redis:7-alpine
    container_name: chatsphere-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ChatSphere Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatsphere-app
    restart: always
    command: ["npm", "run", "start:web"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/chatsphere?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "chatsphere_super_secret_production_jwt_key_2026"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:3001"
      NODE_ENV: "production"

  # ChatSphere Socket.IO Server
  socket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatsphere-socket
    restart: always
    command: ["node", "server/socket.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/chatsphere?schema=public"
      REDIS_URL: "redis://redis:6379"
      SOCKET_PORT: 3001
      NODE_ENV: "production"

volumes:
  postgres_data:
  redis_data:
